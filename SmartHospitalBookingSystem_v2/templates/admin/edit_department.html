{% extends "base.html" %}

{% block title %}
Edit Department
{% endblock %}

{% block content %}

<div class="container py-5">

<div class="card shadow-lg">

<div class="card-header bg-primary text-white">

<h3>✏️ Edit Department</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Department Name</label>

<input
type="text"
name="department_name"
value="{{ department[1] }}"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Description</label>

<textarea
name="description"
class="form-control"
rows="4">{{ department[2] }}</textarea>

</div>

<div class="mb-4">

<label>Status</label>

<select
name="status"
class="form-control">

<option value="Active"
{% if department[3]=="Active" %}selected{% endif %}>
Active
</option>

<option value="Inactive"
{% if department[3]=="Inactive" %}selected{% endif %}>
Inactive
</option>

</select>

</div>

<button class="btn btn-primary">

💾 Update Department

</button>

<a
href="/admin/departments"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
