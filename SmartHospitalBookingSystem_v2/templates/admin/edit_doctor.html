{% extends "base.html" %}

{% block title %}
Edit Doctor
{% endblock %}

{% block content %}

<div class="container py-5">

<div class="card shadow-lg border-0">

<div class="card-header bg-warning text-dark">

<h2>
✏️ Edit Doctor
</h2>

</div>

<div class="card-body">

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Doctor Name</label>
<input type="text"
class="form-control"
name="doctor_name"
value="{{ doctor[3] }}"
required>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Gender</label>

<select class="form-select" name="gender">

<option value="Male"
{% if doctor[4]=='Male' %}selected{% endif %}>
Male
</option>

<option value="Female"
{% if doctor[4]=='Female' %}selected{% endif %}>
Female
</option>

</select>

</div>

<div class="col-md-6 mb-3">
<label class="form-label">Qualification</label>
<input type="text"
class="form-control"
name="qualification"
value="{{ doctor[5] }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Specialization</label>
<input type="text"
class="form-control"
name="specialization"
value="{{ doctor[6] }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Experience (Years)</label>
<input type="number"
class="form-control"
name="experience"
value="{{ doctor[7] }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">License Number</label>
<input type="text"
class="form-control"
name="license_no"
value="{{ doctor[8] }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Phone</label>
<input type="text"
class="form-control"
name="phone"
value="{{ doctor[9] }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Email</label>
<input type="email"
class="form-control"
name="email"
value="{{ doctor[10] }}">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Hospital</label>

<select class="form-select"
name="hospital_id">

{% for h in hospitals %}

<option value="{{ h[0] }}"
{% if h[0]==doctor[1] %}selected{% endif %}>

{{ h[1] }}

</option>

{% endfor %}

</select>

</div>

<div class="col-md-6 mb-3">
<label class="form-label">Department</label>

<select class="form-select"
name="department_id">

{% for d in departments %}

<option value="{{ d[0] }}"
{% if d[0]==doctor[2] %}selected{% endif %}>

{{ d[1] }}

</option>

{% endfor %}

</select>

</div>

<div class="col-md-6 mb-3">
<label class="form-label">Status</label>

<select class="form-select"
name="status">

<option value="Active"
{% if doctor[13]=='Active' %}selected{% endif %}>
Active
</option>

<option value="Inactive"
{% if doctor[13]=='Inactive' %}selected{% endif %}>
Inactive
</option>

</select>

</div>

</div>

<div class="mt-4">

<button class="btn btn-warning">
💾 Update Doctor
</button>

<a href="/admin/doctors"
class="btn btn-secondary">

Cancel

</a>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
