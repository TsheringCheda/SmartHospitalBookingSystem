{% extends "base.html" %}

{% block title %}

Patient Registration

{% endblock %}

{% block content %}

<section class="login-section">

<div class="container">

<div class="row justify-content-center align-items-center min-vh-100">

<div class="col-lg-10">

<div class="card border-0 shadow-lg login-card">

<div class="card-body p-5">

<div class="text-center mb-5">

<div class="login-icon">

<i class="bi bi-person-plus-fill"></i>

</div>

<h2 class="fw-bold mt-4">

Create Patient Account

</h2>

<p class="text-muted">

Register to access Smart Hospital services

</p>

</div>

<form

method="POST"

action="/patient/register">

<div class="row">

<!-- CID -->

<div class="col-md-6 mb-4">

<label class="form-label">

CID Number

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-credit-card-fill"></i>

</span>

<input

type="text"

name="cid"

class="form-control"

required>

</div>

</div>

<!-- Full Name -->

<div class="col-md-6 mb-4">

<label class="form-label">

Full Name

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-person-fill"></i>

</span>

<input

type="text"

name="fullname"

class="form-control"

required>

</div>

</div>

<!-- DOB -->

<div class="col-md-6 mb-4">

<label class="form-label">

Date of Birth

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-calendar-fill"></i>

</span>

<input

type="date"

name="dob"

class="form-control"

required>

</div>

</div>

<!-- Gender -->

<div class="col-md-6 mb-4">

<label class="form-label">

Gender

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-gender-ambiguous"></i>

</span>

<select

name="gender"

class="form-select"

required>

<option value="">Select</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

</div>

<!-- Blood -->

<div class="col-md-6 mb-4">

<label class="form-label">

Blood Group

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-droplet-fill"></i>

</span>

<select

name="blood_group"

class="form-select"

required>

<option>A+</option>

<option>A-</option>

<option>B+</option>

<option>B-</option>

<option>AB+</option>

<option>AB-</option>

<option>O+</option>

<option>O-</option>

</select>

</div>

</div>

<!-- Phone -->

<div class="col-md-6 mb-4">

<label class="form-label">

Phone Number

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-telephone-fill"></i>

</span>

<input

type="text"

name="phone"

class="form-control"

required>

</div>

</div>

<!-- Email -->

<div class="col-md-6 mb-4">

<label class="form-label">

Email

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-envelope-fill"></i>

</span>

<input

type="email"

name="email"

class="form-control"

required>

</div>

</div>

<!-- Username -->

<div class="col-md-6 mb-4">

<label class="form-label">

Username

</label>

<div class="input-group">

<span class="input-group-text">

<i class="bi bi-person-badge-fill"></i>

</span>

<input

type="text"

name="username"

class="form-control"

required>

</div>

</div>

                        <!-- Password -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock-fill"></i>

                                </span>

                                <input

                                    type="password"

                                    name="password"

                                    id="password"

                                    class="form-control"

                                    required>

                            </div>

                        </div>

                        <!-- Confirm Password -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-shield-lock-fill"></i>

                                </span>

                                <input

                                    type="password"

                                    id="confirm_password"

                                    class="form-control"

                                    required>

                            </div>

                            <small id="passwordMessage" class="text-danger"></small>

                        </div>

                        <!-- Dzongkhag -->

                        <div class="col-md-4 mb-4">

                            <label class="form-label">

                                Dzongkhag

                            </label>

                            <input

                                type="text"

                                name="dzongkhag"

                                class="form-control"

                                required>

                        </div>

                        <!-- Gewog -->

                        <div class="col-md-4 mb-4">

                            <label class="form-label">

                                Gewog

                            </label>

                            <input

                                type="text"

                                name="gewog"

                                class="form-control"

                                required>

                        </div>

                        <!-- Village -->

                        <div class="col-md-4 mb-4">

                            <label class="form-label">

                                Village

                            </label>

                            <input

                                type="text"

                                name="village"

                                class="form-control"

                                required>

                        </div>

                        <!-- Guardian -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Guardian Name

                            </label>

                            <input

                                type="text"

                                name="guardian_name"

                                class="form-control"

                                required>

                        </div>

                        <!-- Guardian Phone -->

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Guardian Phone

                            </label>

                            <input

                                type="text"

                                name="guardian_phone"

                                class="form-control"

                                required>

                        </div>

                    </div>

                    <div class="d-grid mt-3">

                        <button

                            type="submit"

                            class="btn btn-primary btn-lg rounded-pill login-btn">

                            <i class="bi bi-person-plus-fill me-2"></i>

                            Create Account

                        </button>

                    </div>

                </form>

                <hr class="my-4">

                <div class="text-center">

                    <p>

                        Already have an account?

                    </p>

                    <a

                        href="/patient/login"

                        class="btn btn-outline-primary rounded-pill px-4">

                        Sign In

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</div>

</section>

<script>

const password=document.getElementById("password");

const confirmPassword=document.getElementById("confirm_password");

const message=document.getElementById("passwordMessage");

confirmPassword.addEventListener("keyup",function(){

    if(password.value!==confirmPassword.value){

        message.innerHTML="Passwords do not match";

    }

    else{

        message.innerHTML="";

    }

});

</script>

{% endblock %}
