{% extends "base.html" %}

{% block title %}
Patient Login
{% endblock %}

{% block content %}

<section class="login-section">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <!-- Left Side -->

            <div class="col-lg-6 d-none d-lg-block"
                 data-aos="fade-right">

                <div class="text-center">

                    <img

                        src="{{ url_for('static', filename='images/doctor.png') }}"

                        class="img-fluid login-image"

                        alt="Healthcare">

                    <h2 class="text-white fw-bold mt-4">

                        Smart Hospital Management System

                    </h2>

                    <p class="text-light">

                        Modern Healthcare.

                        Better Patient Experience.

                    </p>

                </div>

            </div>

            <!-- Login Card -->

            <div class="col-lg-5 col-md-8"
                 data-aos="fade-left">

                <div class="card border-0 shadow-lg login-card">

                    <div class="card-body p-5">

                        <div class="text-center mb-4">

                            <div class="login-icon">

                                <i class="bi bi-person-circle"></i>

                            </div>

                            <h2 class="fw-bold mt-3">

                                Welcome Back

                            </h2>

                            <p class="text-muted">

                                Sign in to continue

                            </p>

                        </div>

                        <form
                            method="POST"
                            action="{{ url_for('patient_login') }}">

                            <!-- Email -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-envelope-fill"></i>

                                    </span>

                                    <input

                                        type="email"

                                        name="email"

                                        class="form-control"

                                        placeholder="Enter your email"

                                        required>

                                </div>

                            </div>

                            <!-- Password -->

                            <div class="mb-4">

                                <label class="form-label">

                                    Password

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-lock-fill"></i>

                                    </span>

                                    <input
                                        type="password"
                                        name="password"
                                        class="form-control"
                                        placeholder="Enter your password"
                                        required>

                                </div>

                            </div>

                                                        <!-- Remember & Forgot -->

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input

                                        class="form-check-input"

                                        type="checkbox"

                                        id="rememberMe">

                                    <label

                                        class="form-check-label"

                                        for="rememberMe">

                                        Remember Me

                                    </label>

                                </div>

                                <a

                                    href="#"

                                    class="text-decoration-none">

                                    Forgot Password?

                                </a>

                            </div>

                            <!-- Login Button -->

                            <div class="d-grid">

                                <button

                                    type="submit"

                                    class="btn btn-primary btn-lg rounded-pill login-btn">

                                    <i class="bi bi-box-arrow-in-right me-2"></i>

                                    Sign In Securely

                                </button>

                            </div>

                        </form>

                        <hr class="my-4">

                        <div class="text-center">

                            <p class="mb-2">

                                Don't have an account?

                            </p>

                            <a

                                href="{{ url_for('register_patient') }}"

                                class="btn btn-outline-primary rounded-pill px-4">

                                Create New Account

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
