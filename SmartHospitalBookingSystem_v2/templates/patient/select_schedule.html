{% extends "base.html" %}

{% block title %}
Select Schedule
{% endblock %}

{% block content %}

<div class="container py-5">

<div class="card shadow-lg">

<div class="card-header bg-primary text-white">

<h3>Select Available Schedule</h3>

</div>

<div class="card-body">

<form method="POST" action="{{ url_for('confirm_booking') }}">

<div class="table-responsive">

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>Select</th>

<th>Date</th>

<th>Start</th>

<th>End</th>

<th>Consultation</th>

<th>Available Tokens</th>

</tr>

</thead>

<tbody>

{% for s in schedules %}

<tr>

<td>

<input
type="radio"
name="schedule_id"
value="{{ s[0] }}"
required>

</td>

<td>{{ s[1] }}</td>

<td>{{ s[2] }}</td>

<td>{{ s[3] }}</td>

<td>{{ s[4] }}</td>

<td>

<span class="badge bg-success">

{{ s[5] }}

</span>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<div class="text-end">

<button class="btn btn-success btn-lg">

Continue

</button>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
